<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廃病院からの脱出 - Horror RPG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'PixelFont';
    src: local('Courier New'), local('monospace');
  }

  body {
    background: #0a0a0a;
    color: #d0d0d0;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    image-rendering: pixelated;
  }

  /* ===== Overlays ===== */
  #noise-overlay {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 1px, transparent 1px, transparent 2px);
    pointer-events: none; z-index: 9999;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.97} 50%{opacity:1} 100%{opacity:.98} }

  #vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.9) 100%);
    pointer-events: none; z-index: 9998;
  }

  #fade {
    position: fixed; inset: 0; background: #000; z-index: 500;
    opacity: 0; pointer-events: none; transition: opacity 0.6s;
  }
  #fade.active { opacity: 1; pointer-events: all; }

  /* ===== Title Screen ===== */
  #title-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000; z-index: 1000;
    transition: opacity 1.5s;
  }
  #title-screen.hidden { opacity: 0; pointer-events: none; }

  .title-main {
    font-size: 3rem; color: #8b0000;
    text-shadow: 0 0 20px #8b0000, 0 0 60px #5a0000, 2px 2px 0 #000;
    letter-spacing: 0.08em;
    animation: titlePulse 3s ease-in-out infinite;
  }
  .title-sub {
    font-size: 1.2rem; color: #555; margin-top: 0.3rem;
    letter-spacing: 0.2em;
  }
  @keyframes titlePulse {
    0%,100% { text-shadow: 0 0 20px #8b0000, 0 0 60px #5a0000, 2px 2px 0 #000; }
    50%     { text-shadow: 0 0 40px #ff0000, 0 0 80px #8b0000, 2px 2px 0 #000; }
  }
  #title-screen p { margin-top: 1.5rem; font-size: 0.95rem; color: #666; }

  .btn-main {
    margin-top: 2rem; padding: 0.8rem 3rem;
    background: transparent; border: 2px solid #8b0000;
    color: #c8c8c8; font-size: 1.1rem;
    font-family: 'Courier New', monospace;
    cursor: pointer; transition: all 0.3s; letter-spacing: 0.15em;
  }
  .btn-main:hover { background: #8b0000; color: #fff; box-shadow: 0 0 30px rgba(139,0,0,0.6); }

  /* ===== Game Container ===== */
  #game { display:none; width:100vw; height:100vh; position:relative; }
  #game.active { display: flex; flex-direction: column; }

  /* ===== Top HUD ===== */
  #hud {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: rgba(0,0,0,0.9);
    border-bottom: 2px solid #333; z-index: 60;
    flex-shrink: 0; height: 56px;
  }
  #hud-left { display: flex; align-items: center; gap: 16px; }
  #hud-right { display: flex; align-items: center; gap: 10px; }
  .hud-label { color: #8b0000; font-size: 0.75rem; letter-spacing: 0.1em; }
  .hud-val { color: #ddd; font-size: 0.85rem; }

  .bar-container {
    width: 140px; height: 14px;
    background: #1a1a1a; border: 1px solid #444;
    border-radius: 2px; overflow: hidden; position: relative;
  }
  .bar-fill {
    height: 100%; transition: width 0.5s;
    position: absolute; left: 0; top: 0;
  }
  .bar-hp .bar-fill { background: linear-gradient(90deg, #8b0000, #cc0000); }
  .bar-exp .bar-fill { background: linear-gradient(90deg, #005580, #00aaff); }
  .bar-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; color: #fff; text-shadow: 1px 1px 0 #000;
    z-index: 1;
  }

  .inv-item-hud {
    width: 36px; height: 36px;
    background: rgba(30,10,10,0.8); border: 1px solid rgba(139,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; border-radius: 3px; position: relative; cursor: default;
  }
  .inv-item-hud .tooltip {
    display: none; position: absolute; top: 42px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.95); color: #aaa; padding: 3px 8px;
    font-size: 0.7rem; white-space: nowrap; border-radius: 3px; border: 1px solid #333;
    z-index: 100;
  }
  .inv-item-hud:hover .tooltip { display: block; }

  /* ===== Scene Area ===== */
  #scene-area {
    flex: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.8s;
  }
  #room-label {
    position: absolute; top: 12px; left: 16px;
    font-size: 0.8rem; color: #8b0000; letter-spacing: 0.15em;
    text-shadow: 0 0 10px rgba(139,0,0,0.5);
  }
  #scene-emoji {
    font-size: 10rem; opacity: 0.1; user-select: none; pointer-events: none;
    position: absolute;
  }

  /* Blood drips */
  .blood-drip {
    position: absolute; top: 0; width: 3px;
    background: linear-gradient(to bottom, #8b0000, transparent);
    border-radius: 0 0 2px 2px; opacity: 0.35;
    animation: drip 4s ease-in infinite;
  }
  @keyframes drip { 0%{height:0;opacity:0.4} 80%{height:100px;opacity:0.25} 100%{height:100px;opacity:0} }

  /* ===== Text Box ===== */
  #text-box {
    flex-shrink: 0; min-height: 140px; max-height: 160px;
    background: linear-gradient(to top, rgba(0,0,0,0.97), rgba(5,0,0,0.9));
    padding: 12px 20px; border-top: 2px solid #333;
    overflow-y: auto;
  }
  #speaker { font-weight: 700; color: #8b0000; font-size: 0.85rem; margin-bottom: 4px; letter-spacing: 0.08em; }
  #message { font-size: 0.9rem; line-height: 1.7; white-space: pre-wrap; }
  #message .cursor {
    display: inline-block; width: 8px; height: 1em;
    background: #8b0000; margin-left: 2px; vertical-align: text-bottom;
    animation: blink 0.6s step-end infinite;
  }
  @keyframes blink { 50%{opacity:0} }

  /* ===== Choices ===== */
  #choices {
    position: absolute; bottom: 170px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 5px;
    width: min(92%, 560px); z-index: 60;
  }
  .choice-btn {
    padding: 8px 16px;
    background: rgba(15,0,0,0.9); border: 1px solid rgba(139,0,0,0.4);
    color: #c8c8c8; font-size: 0.9rem;
    font-family: 'Courier New', monospace;
    cursor: pointer; transition: all 0.2s; text-align: left;
  }
  .choice-btn:hover {
    background: rgba(139,0,0,0.3); border-color: #8b0000;
    padding-left: 24px; color: #fff;
  }

  /* ===== Battle Screen ===== */
  #battle-screen {
    position: fixed; inset: 0; z-index: 800;
    display: none; flex-direction: column;
    background: #050005;
  }
  #battle-screen.active { display: flex; }

  #battle-bg {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    background: radial-gradient(ellipse at center bottom, #1a0505 0%, #050005 70%);
  }
  #battle-bg .enemy-sprite {
    font-size: 8rem; filter: drop-shadow(0 0 20px rgba(139,0,0,0.5));
    animation: enemyIdle 2s ease-in-out infinite;
    transition: filter 0.2s, transform 0.2s;
  }
  @keyframes enemyIdle {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }
  .enemy-hit { animation: enemyHit 0.3s !important; filter: brightness(3) !important; }
  @keyframes enemyHit {
    0%  { transform: translate(0,0); filter: brightness(3); }
    25% { transform: translate(-10px,0); }
    50% { transform: translate(10px,0); }
    75% { transform: translate(-5px,0); }
    100%{ transform: translate(0,0); }
  }

  #enemy-info {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    text-align: center;
  }
  #enemy-name { font-size: 1rem; color: #cc4444; margin-bottom: 4px; letter-spacing: 0.1em; }
  #enemy-hp-bar {
    width: 200px; height: 16px; background: #1a1a1a;
    border: 1px solid #555; border-radius: 2px; overflow: hidden; position: relative;
  }
  #enemy-hp-fill {
    height: 100%; background: linear-gradient(90deg, #660000, #cc0000);
    transition: width 0.4s; position: absolute; left: 0; top: 0;
  }
  #enemy-hp-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; color: #fff; text-shadow: 1px 1px 0 #000; z-index: 1;
  }

  #battle-log {
    height: 60px; padding: 8px 16px;
    background: rgba(0,0,0,0.95); border-top: 2px solid #333;
    font-size: 0.85rem; line-height: 1.5; overflow-y: auto;
    color: #aaa;
  }

  #battle-actions {
    display: flex; gap: 0; border-top: 1px solid #333;
    flex-shrink: 0; background: #0a0a0a;
  }
  .battle-btn {
    flex: 1; padding: 14px 8px;
    background: rgba(10,0,0,0.95);
    border: none; border-right: 1px solid #333;
    color: #c8c8c8; font-size: 0.95rem;
    font-family: 'Courier New', monospace;
    cursor: pointer; transition: all 0.2s;
  }
  .battle-btn:last-child { border-right: none; }
  .battle-btn:hover { background: rgba(139,0,0,0.3); color: #fff; }
  .battle-btn:disabled { color: #444; cursor: default; }
  .battle-btn:disabled:hover { background: rgba(10,0,0,0.95); color: #444; }

  /* Player damage flash */
  .player-damage { animation: playerDmg 0.3s; }
  @keyframes playerDmg {
    0%,100% { border-color: #333; }
    50%     { border-color: #ff0000; background: rgba(80,0,0,0.3); }
  }

  /* ===== Jumpscare ===== */
  #jumpscare {
    position: fixed; inset: 0; background: #000;
    display: none; align-items: center; justify-content: center;
    z-index: 10000; flex-direction: column;
  }
  #jumpscare.active { display: flex; }
  #jumpscare .scare-text { font-size: 8rem; animation: scareShake 0.1s infinite; }
  @keyframes scareShake {
    0%{transform:translate(0,0) rotate(0deg)} 25%{transform:translate(-5px,5px) rotate(-2deg)}
    50%{transform:translate(5px,-5px) rotate(2deg)} 75%{transform:translate(-3px,-3px) rotate(-1deg)}
    100%{transform:translate(3px,3px) rotate(1deg)}
  }

  /* ===== Level Up ===== */
  #levelup-overlay {
    position: fixed; inset: 0; z-index: 900;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85);
  }
  #levelup-overlay.active { display: flex; }
  #levelup-box {
    text-align: center; padding: 30px 50px;
    border: 2px solid #aa8800; background: rgba(20,15,0,0.95);
    animation: lvlGlow 1s ease-in-out infinite alternate;
  }
  @keyframes lvlGlow {
    from { box-shadow: 0 0 20px rgba(170,136,0,0.3); }
    to   { box-shadow: 0 0 40px rgba(170,136,0,0.6); }
  }
  #levelup-box h2 { color: #ffcc00; font-size: 1.8rem; letter-spacing: 0.1em; }
  #levelup-box p { color: #cca; font-size: 0.9rem; margin-top: 8px; line-height: 1.6; }

  /* ===== Ending ===== */
  #ending-screen {
    position: fixed; inset: 0; background: #000;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10000;
  }
  #ending-screen.active { display: flex; }
  #ending-screen h2 { font-size: 2.5rem; margin-bottom: 1rem; }
  #ending-screen p { font-size: 0.95rem; max-width: 520px; text-align: center; line-height: 1.8; color: #999; }

  /* ===== Screen Shake ===== */
  .screen-shake { animation: screenShake 0.35s; }
  @keyframes screenShake {
    0%{transform:translate(0,0)} 20%{transform:translate(-6px,3px)}
    40%{transform:translate(5px,-5px)} 60%{transform:translate(-3px,6px)}
    80%{transform:translate(6px,-2px)} 100%{transform:translate(0,0)}
  }

  /* ===== Damage Numbers ===== */
  .dmg-number {
    position: absolute; font-size: 1.8rem; font-weight: bold;
    pointer-events: none; z-index: 100;
    animation: dmgFloat 1s forwards;
  }
  .dmg-number.player-dmg { color: #ff4444; }
  .dmg-number.enemy-dmg  { color: #ffcc00; }
  .dmg-number.heal        { color: #44ff44; }
  @keyframes dmgFloat {
    0%   { opacity: 1; transform: translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
  }

  /* ===== Volume Control ===== */
  #vol-control {
    position: fixed; bottom: 8px; right: 12px; z-index: 9999;
    display: flex; align-items: center; gap: 6px;
    opacity: 0.5; transition: opacity 0.3s;
  }
  #vol-control:hover { opacity: 1; }
  #vol-control label { color: #555; font-size: 0.7rem; }
  #vol-slider {
    width: 60px; height: 4px; accent-color: #8b0000;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="noise-overlay"></div>
<div id="vignette"></div>
<div id="fade"></div>

<!-- Volume -->
<div id="vol-control">
  <label>VOL</label>
  <input type="range" id="vol-slider" min="0" max="100" value="50">
</div>

<!-- Title -->
<div id="title-screen">
  <div class="title-main">廃病院からの脱出</div>
  <div class="title-sub">― HORROR RPG ―</div>
  <p>目を覚ますと、そこは闇に包まれた廃病院だった。</p>
  <button class="btn-main" id="start-btn">GAME START</button>
</div>

<!-- Game -->
<div id="game">
  <!-- HUD -->
  <div id="hud">
    <div id="hud-left">
      <div>
        <div class="hud-label">Lv.<span id="hud-lv">1</span> <span id="hud-name">主人公</span></div>
        <div class="bar-container bar-hp">
          <div class="bar-fill" id="hp-fill" style="width:100%"></div>
          <div class="bar-text" id="hp-text">50 / 50</div>
        </div>
      </div>
      <div>
        <div class="hud-label">EXP</div>
        <div class="bar-container bar-exp">
          <div class="bar-fill" id="exp-fill" style="width:0%"></div>
          <div class="bar-text" id="exp-text">0 / 20</div>
        </div>
      </div>
      <div>
        <div class="hud-label">ATK <span id="hud-atk" class="hud-val">8</span></div>
        <div class="hud-label">DEF <span id="hud-def" class="hud-val">4</span></div>
      </div>
    </div>
    <div id="hud-right"></div>
  </div>

  <!-- Scene -->
  <div id="scene-area">
    <div id="room-label"></div>
    <div id="scene-emoji"></div>
    <div class="blood-drip" style="left:8%; animation-delay:0s;"></div>
    <div class="blood-drip" style="left:25%; animation-delay:1.2s;"></div>
    <div class="blood-drip" style="left:50%; animation-delay:2.5s;"></div>
    <div class="blood-drip" style="left:75%; animation-delay:0.8s;"></div>
    <div class="blood-drip" style="left:93%; animation-delay:3.1s;"></div>
  </div>

  <!-- Choices -->
  <div id="choices"></div>

  <!-- Text Box -->
  <div id="text-box">
    <div id="speaker"></div>
    <div id="message"></div>
  </div>
</div>

<!-- Battle -->
<div id="battle-screen">
  <div id="battle-bg">
    <div id="enemy-info">
      <div id="enemy-name"></div>
      <div id="enemy-hp-bar">
        <div id="enemy-hp-fill" style="width:100%"></div>
        <div id="enemy-hp-text"></div>
      </div>
    </div>
    <div class="enemy-sprite" id="enemy-sprite"></div>
  </div>
  <div id="battle-log"></div>
  <div id="battle-actions">
    <button class="battle-btn" id="btn-attack">⚔️ 攻撃</button>
    <button class="battle-btn" id="btn-skill">🔥 スキル</button>
    <button class="battle-btn" id="btn-heal">💊 回復</button>
    <button class="battle-btn" id="btn-flee">🚪 逃げる</button>
  </div>
</div>

<!-- Level Up -->
<div id="levelup-overlay">
  <div id="levelup-box">
    <h2>LEVEL UP!</h2>
    <p id="levelup-text"></p>
  </div>
</div>

<!-- Jumpscare -->
<div id="jumpscare"><div class="scare-text"></div></div>

<!-- Ending -->
<div id="ending-screen">
  <h2 id="ending-title"></h2>
  <p id="ending-text"></p>
  <button class="btn-main" onclick="location.reload()" style="margin-top:2rem;">もう一度プレイする</button>
</div>

<script>
// ============================================================
// HORROR RPG ESCAPE GAME ENGINE
// ============================================================
const $ = id => document.getElementById(id);

// ============================================================
// AUDIO ENGINE - BGM & SE via Web Audio API
// ============================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
let masterGain = null;
let bgmNodes = [];

function initAudio() {
  if (actx) return;
  actx = new AudioCtx();
  masterGain = actx.createGain();
  masterGain.gain.value = 0.5;
  masterGain.connect(actx.destination);
}

// Volume control
$('vol-slider').addEventListener('input', e => {
  const v = e.target.value / 100;
  if (masterGain) masterGain.gain.value = v;
});

function tone(freq, dur, type = 'sine', vol = 0.1, delay = 0) {
  if (!actx) return;
  const t = actx.currentTime + delay;
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t + dur);
  return osc;
}

// --- BGM System ---
let currentBgm = null;
let bgmInterval = null;

function stopBgm() {
  currentBgm = null;
  if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
  bgmNodes.forEach(n => { try { n.stop(); } catch(e){} });
  bgmNodes = [];
}

function playBgmExplore() {
  stopBgm();
  currentBgm = 'explore';
  function loop() {
    if (currentBgm !== 'explore') return;
    // Eerie ambient drone
    const notes = [55, 58, 52, 49];
    const n = notes[Math.floor(Math.random() * notes.length)];
    tone(n, 4, 'sawtooth', 0.025);
    tone(n * 1.01, 4, 'sine', 0.02); // slight detune for unease
    // Random creepy high note
    if (Math.random() < 0.3) {
      const delay = 1 + Math.random() * 2;
      tone(800 + Math.random() * 600, 0.8, 'sine', 0.008, delay);
    }
    // Heartbeat-like pulse
    if (Math.random() < 0.4) {
      tone(40, 0.15, 'sine', 0.04, 0.5);
      tone(40, 0.1, 'sine', 0.03, 0.8);
    }
  }
  loop();
  bgmInterval = setInterval(loop, 4500);
}

function playBgmBattle() {
  stopBgm();
  currentBgm = 'battle';
  let beat = 0;
  function loop() {
    if (currentBgm !== 'battle') return;
    const t = actx.currentTime;
    // Driving bass pattern
    const bassNotes = [82, 82, 98, 82, 73, 73, 82, 73];
    const b = bassNotes[beat % bassNotes.length];
    tone(b, 0.2, 'sawtooth', 0.06);
    tone(b * 0.5, 0.25, 'square', 0.04);
    // Percussion-like noise
    if (beat % 2 === 0) {
      const nOsc = actx.createOscillator();
      const nG = actx.createGain();
      nOsc.type = 'square';
      nOsc.frequency.setValueAtTime(150 + Math.random() * 100, t);
      nOsc.frequency.exponentialRampToValueAtTime(30, t + 0.08);
      nG.gain.setValueAtTime(0.07, t);
      nG.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      nOsc.connect(nG); nG.connect(masterGain);
      nOsc.start(t); nOsc.stop(t + 0.1);
      bgmNodes.push(nOsc);
    }
    // Tension melody
    if (beat % 4 === 0) {
      const melNotes = [330, 311, 293, 277, 330, 370, 293, 247];
      const m = melNotes[Math.floor(beat / 4) % melNotes.length];
      tone(m, 0.3, 'triangle', 0.03, 0.1);
    }
    beat++;
  }
  loop();
  bgmInterval = setInterval(loop, 280);
}

function playBgmBoss() {
  stopBgm();
  currentBgm = 'boss';
  let beat = 0;
  function loop() {
    if (currentBgm !== 'boss') return;
    const bassNotes = [55, 55, 65, 55, 49, 49, 55, 49];
    const b = bassNotes[beat % bassNotes.length];
    tone(b, 0.2, 'sawtooth', 0.07);
    tone(b * 2, 0.15, 'square', 0.03);
    // Heavy percussion
    const t = actx.currentTime;
    const nOsc = actx.createOscillator();
    const nG = actx.createGain();
    nOsc.type = 'sawtooth';
    nOsc.frequency.setValueAtTime(200 + Math.random() * 50, t);
    nOsc.frequency.exponentialRampToValueAtTime(20, t + 0.1);
    nG.gain.setValueAtTime(0.08, t);
    nG.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    nOsc.connect(nG); nG.connect(masterGain);
    nOsc.start(t); nOsc.stop(t + 0.12);
    bgmNodes.push(nOsc);
    // Dissonant melody
    if (beat % 3 === 0) {
      tone(220, 0.4, 'sawtooth', 0.025, 0);
      tone(233, 0.4, 'sine', 0.02, 0); // dissonant interval
    }
    beat++;
  }
  loop();
  bgmInterval = setInterval(loop, 240);
}

function playBgmSafe() {
  stopBgm();
  currentBgm = 'safe';
  let beat = 0;
  function loop() {
    if (currentBgm !== 'safe') return;
    // Calm but eerie pads
    const notes = [220, 262, 330, 262, 247, 294, 330, 294];
    const n = notes[beat % notes.length];
    tone(n, 1.5, 'sine', 0.02);
    tone(n * 0.5, 2, 'triangle', 0.015);
    beat++;
  }
  loop();
  bgmInterval = setInterval(loop, 2000);
}

// Typewriter
function typeText(speaker, text) {
  return new Promise(resolve => {
    $('speaker').textContent = speaker;
    $('message').innerHTML = '';
    state.typing = true;
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    function tick() {
      if (!state.typing) { $('message').textContent = text; resolve(); return; }
      if (i < text.length) {
        $('message').textContent = text.substring(0, i + 1);
        $('message').appendChild(cursor);
        i++;
        const ch = text[i-1];
        const delay = (ch === '。' || ch === '…' || ch === '！' || ch === '？') ? 100 : 25 + Math.random() * 25;
        setTimeout(tick, delay);
      } else { state.typing = false; $('message').appendChild(cursor); resolve(); }
    }
    tick();
  });
}
document.addEventListener('click', e => {
  if (state.typing && !e.target.closest('.choice-btn, .battle-btn, .btn-main, #vol-control'))
    state.typing = false;
});

function showChoices(choices) {
  const el = $('choices');
  el.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.addEventListener('click', () => { el.innerHTML = ''; c.action(); });
    el.appendChild(btn);
  });
}

function showEnding(title, text, color = '#8b0000') {
  stopBgm();
  $('ending-title').textContent = title;
  $('ending-title').style.color = color;
  $('ending-text').textContent = text;
  $('ending-screen').classList.add('active');
}

// ============================================================
// LEVEL UP SYSTEM
// ============================================================
function gainExp(amount) {
  player.exp += amount;
  while (player.exp >= player.nextExp) {
    player.exp -= player.nextExp;
    player.level++;
    player.maxHp += 12;
    player.hp = player.maxHp;
    player.atk += 3;
    player.def += 2;
    player.nextExp = Math.floor(player.nextExp * 1.5);
    if (player.level === 3) { player.skillName = '暗黒斬'; player.skillCost = 12; }
    if (player.level === 5) { player.skillName = '滅殺'; player.skillCost = 15; }
    showLevelUp();
    seLevelUp();
  }
  updateHud();
}

function showLevelUp() {
  $('levelup-text').innerHTML =
    `レベル ${player.level} に上がった！<br>` +
    `HP: ${player.maxHp}　ATK: ${player.atk}　DEF: ${player.def}` +
    (player.level === 3 ? '<br>新スキル習得: 暗黒斬' : '') +
    (player.level === 5 ? '<br>新スキル習得: 滅殺' : '');
  $('levelup-overlay').classList.add('active');
  setTimeout(() => $('levelup-overlay').classList.remove('active'), 2500);
}

// BATTLE SYSTEM
// ============================================================
let currentEnemy = null;
let battleResolve = null;
let battleActionsEnabled = false;

const enemies = {
  shadow:    { name: '徘徊する影',     emoji: '👤', hp: 30, atk: 7,  def: 2, exp: 12, isBoss: false },
  nurse:     { name: '狂気の看護師',   emoji: '👩‍⚕️', hp: 45, atk: 10, def: 4, exp: 18, isBoss: false },
  patient:   { name: '被験者の亡霊',   emoji: '👻', hp: 35, atk: 12, def: 3, exp: 15, isBoss: false },
  hound:     { name: '異形の犬',       emoji: '🐕‍🦺', hp: 40, atk: 9,  def: 5, exp: 16, isBoss: false },
  specimen:  { name: '被験者No.7',     emoji: '😱', hp: 120, atk: 18, def: 8, exp: 50, isBoss: true },
};

function spawnDmgNumber(text, cssClass, parent) {
  const el = document.createElement('div');
  el.className = 'dmg-number ' + cssClass;
  el.textContent = text;
  el.style.left = (30 + Math.random() * 40) + '%';
  el.style.top  = (30 + Math.random() * 20) + '%';
  parent.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function startBattle(enemyId, canFlee = true) {
  return new Promise(resolve => {
    battleResolve = resolve;
    const tmpl = enemies[enemyId];
    currentEnemy = { ...tmpl, maxHp: tmpl.hp };
    state.inBattle = true;

    // UI
    $('enemy-name').textContent = currentEnemy.name;
    $('enemy-sprite').textContent = currentEnemy.emoji;
    $('enemy-sprite').classList.remove('enemy-hit');
    updateEnemyHp();
    $('battle-log').innerHTML = `<div>${currentEnemy.name} が現れた！</div>`;
    $('battle-screen').classList.add('active');
    $('btn-flee').disabled = !canFlee;

    if (tmpl.isBoss) playBgmBoss();
    else playBgmBattle();

    battleActionsEnabled = true;
  });
}

function updateEnemyHp() {
  const pct = Math.max(0, currentEnemy.hp / currentEnemy.maxHp * 100);
  $('enemy-hp-fill').style.width = pct + '%';
  $('enemy-hp-text').textContent = `${Math.max(0,currentEnemy.hp)} / ${currentEnemy.maxHp}`;
}

function battleLog(msg) {
  const el = $('battle-log');
  el.innerHTML += `<div>${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function calcDamage(atk, def) {
  const base = Math.max(1, atk - def + Math.floor(Math.random() * 5) - 2);
  const crit = Math.random() < 0.1;
  return { dmg: crit ? base * 2 : base, crit };
}

async function playerAttack(multiplier = 1, isSkill = false) {
  const effectiveAtk = Math.floor(player.atk * multiplier);
  const { dmg, crit } = calcDamage(effectiveAtk, currentEnemy.def);
  currentEnemy.hp -= dmg;

  if (isSkill) seSkill(); else seAttack();
  $('enemy-sprite').classList.add('enemy-hit');
  spawnDmgNumber((crit ? 'CRITICAL! ' : '') + dmg, 'enemy-dmg', $('battle-bg'));
  setTimeout(() => $('enemy-sprite').classList.remove('enemy-hit'), 300);

  const label = isSkill ? player.skillName : '攻撃';
  battleLog(`${player.name}の${label}！ ${dmg}のダメージ！${crit ? ' 会心の一撃！' : ''}`);
  updateEnemyHp();

  await sleep(500);

  if (currentEnemy.hp <= 0) {
    await enemyDefeated();
    return;
  }
  await enemyTurn();
}

async function enemyTurn() {
  await sleep(300);
  const { dmg, crit } = calcDamage(currentEnemy.atk, player.def);
  player.hp -= dmg;
  if (player.hp < 0) player.hp = 0;

  seEnemyAttack();
  $('hud').classList.add('player-damage');
  spawnDmgNumber(dmg, 'player-dmg', $('battle-bg'));
  setTimeout(() => $('hud').classList.remove('player-damage'), 300);

  battleLog(`${currentEnemy.name}の攻撃！ ${dmg}のダメージ！${crit ? ' 痛恨の一撃！' : ''}`);
  updateHud();

  await sleep(400);

  if (player.hp <= 0) {
    await playerDefeated();
    return;
  }
  battleActionsEnabled = true;
}

async function enemyDefeated() {
  battleActionsEnabled = false;
  seVictory();
  battleLog(`${currentEnemy.name}を倒した！ ${currentEnemy.exp} EXP を獲得！`);
  await sleep(800);
  gainExp(currentEnemy.exp);
  await sleep(1200);
  $('battle-screen').classList.remove('active');
  state.inBattle = false;
  playBgmExplore();
  if (battleResolve) battleResolve('win');
}

async function playerDefeated() {
  battleActionsEnabled = false;
  seDeath();
  battleLog(`${player.name}は倒れた…`);
  await sleep(1500);
  $('battle-screen').classList.remove('active');
  state.inBattle = false;
  if (battleResolve) battleResolve('lose');
}

// Battle button handlers
$('btn-attack').addEventListener('click', async () => {
  if (!battleActionsEnabled) return;
  battleActionsEnabled = false;
  await playerAttack(1, false);
});

$('btn-skill').addEventListener('click', async () => {
  if (!battleActionsEnabled) return;
  if (player.hp <= player.skillCost) {
    battleLog('HPが足りない！');
    return;
  }
  battleActionsEnabled = false;
  player.hp -= player.skillCost;
  updateHud();
  battleLog(`${player.name}は ${player.skillName} を放った！ (HP -${player.skillCost})`);
  await playerAttack(2.2, true);
});

$('btn-heal').addEventListener('click', async () => {
  if (!battleActionsEnabled) return;
  if (player.potions <= 0) { battleLog('回復薬がない！'); return; }
  battleActionsEnabled = false;
  player.potions--;
  const heal = Math.floor(player.maxHp * 0.5);
  player.hp = Math.min(player.maxHp, player.hp + heal);
  seHeal();
  spawnDmgNumber('+' + heal, 'heal', $('battle-bg'));
  battleLog(`回復薬を使った！ HPが ${heal} 回復した！`);
  updateHud();
  await sleep(500);
  await enemyTurn();
});

$('btn-flee').addEventListener('click', async () => {
  if (!battleActionsEnabled || $('btn-flee').disabled) return;
  battleActionsEnabled = false;
  seFlee();
  if (Math.random() < 0.6) {
    seFleeSuccess();
    battleLog('うまく逃げ出した！');
    await sleep(800);
    $('battle-screen').classList.remove('active');
    state.inBattle = false;
    playBgmExplore();
    if (battleResolve) battleResolve('flee');
  } else {
    battleLog('逃げられなかった！');
    seMiss();
    await sleep(400);
    await enemyTurn();
  }
});

async function randomEncounter() {
  if (Math.random() < 0.35) {
    const pool = ['shadow', 'nurse', 'patient', 'hound'];
    const id = pool[Math.floor(Math.random() * pool.length)];
    await typeText('', '…！何かの気配がする！');
    screenShake();
    await sleep(400);
    const result = await startBattle(id, true);
    if (result === 'lose') {
      await gameOver();
      return true;
    }
    // Chance to find potion after battle
    if (result === 'win' && Math.random() < 0.3) {
      player.potions++;
      sePickup();
      await typeText('', '戦闘の後、回復薬を見つけた！');
      updateHud();
    }
  }
  return false;
}

async function gameOver() {
  stopBgm();
  await fadeTransition(() => {});
  showEnding(
    'GAME OVER',
    'あなたの意識は闇に飲まれた…\n廃病院の中で、また一つ、亡霊が増えた。\n\n次こそは脱出できるだろうか…',
    '#8b0000'
  );
}

  room_corridor();
}
async function action_goBasementConfirm() {
  showChoices([
    { text: '☠️ それでも地下へ下りる', action: room_basement },
    { text: '↩️ やめておく', action: room_corridor },
  ]);
}

// --- Room 3: ナースステーション ---
async function room_nurseStation() {
  await fadeTransition(() => {
    setRoom('ナースステーション', 'linear-gradient(180deg, #0d0a0a 0%, #1a0d0d 100%)', '💊');
  });

  if (!state.flags.visitedNurse) {
    await typeText('', 'カウンターの向こうには、散乱したカルテと壊れたパソコン。');
    await sleep(300);
    await typeText('', '壁にかけられたホワイトボードには、判読できない文字で\n何かが殴り書きされている…');
    await sleep(200);
    if (hasItem('flashlight')) {
      await typeText('', '懐中電灯で照らすと、文字が読めた。');
      await sleep(200);
      await typeText('ホワイトボード', '「暗証番号: 院長の部屋番号を逆から\n部屋番号は 304」');
      state.flags.knowPasscode = true;
      await typeText('', '…つまり暗証番号は「403」か。');
    } else {
      await typeText('', '暗くて文字が読めない。明かりがあれば…');
    }
    state.flags.visitedNurse = true;
  } else {
    await typeText('', 'ナースステーション。カルテが散らばっている。');
    if (!state.flags.knowPasscode && hasItem('flashlight')) {
      await typeText('', '懐中電灯で照らすと、ホワイトボードの文字が読めた。');
      await typeText('ホワイトボード', '「暗証番号: 院長の部屋番号を逆から → 304」');
      state.flags.knowPasscode = true;
      await typeText('', '…暗証番号は「403」だ。');
    }
  }
  await sleep(200);
  showChoices([
    { text: '🔍 カウンターの引き出しを調べる', action: action_nurseDrawer },
    { text: '↩️ 廊下に戻る', action: room_corridor },
  ]);
}

async function action_nurseDrawer() {
  if (!state.flags.searchedNurseDrawer) {
    await typeText('', '引き出しを開けると…古い鍵が1つ。ラベルには「倉庫」と書かれている。');
    addItem('storageKey', '倉庫の鍵', '🗝️');
    state.flags.searchedNurseDrawer = true;
    await sleep(200);
    await typeText('', 'さらに奥に回復薬が2つ隠されていた！');
    player.potions += 2;
    sePickup();
    updateHud();
  } else {
    await typeText('', '引き出しにはもう何もない。');
  }
  await sleep(200);
  showChoices([{ text: '↩️ 廊下に戻る', action: room_corridor }]);
}

// --- Room 4: 3階 ---
async function room_stairsUp() {
  await fadeTransition(() => {
    setRoom('3階 廊下', 'linear-gradient(180deg, #0a0a0d 0%, #0d0505 100%)', '🔒');
  });

  // Encounter chance
  if (state.flags.visited3F) {
    const dead = await randomEncounter();
    if (dead) return;
  }

  if (!state.flags.visited3F) {
    await typeText('', '3階に上がった。ここは一段と暗い。');
    await sleep(300);
    await typeText('', '廊下の突き当たりに「院長室 304」と書かれた扉がある。\nその手前に、鍵のかかった倉庫がある。');
    state.flags.visited3F = true;

    await sleep(600);
    await typeText('', '……ッ！');
    await jumpscare('👁️', 500);
    await typeText('', '廊下の奥の暗闘から、何かがこちらを見ていた気がした…');
    await sleep(300);

    // First battle (tutorial-like)
    await typeText('', '…影が動いた！');
    const result = await startBattle('shadow', false);
    if (result === 'lose') { await gameOver(); return; }
    await typeText('', '何とか撃退した…だが、この先にはもっと危険が待っていそうだ。');
  } else {
    await typeText('', '3階の廊下。院長室と倉庫がある。');
  }
  await sleep(200);
  showChoices([
    { text: '🔒 院長室の扉を調べる', action: action_directorDoor },
    { text: '📦 倉庫を調べる', action: action_storage },
    { text: '⬇️ 2階に戻る', action: room_corridor },
  ]);
}

async function action_directorDoor() {
  if (state.flags.directorUnlocked) { await room_directorRoom(); return; }
  await typeText('', '院長室の扉にはテンキー式のロックがかかっている。');
  if (state.flags.knowPasscode) {
    showChoices([
      { text: '🔢 暗証番号「403」を入力する', action: action_unlockDirector },
      { text: '↩️ 戻る', action: room_stairsUp },
    ]);
  } else {
    await typeText('', '暗証番号が分からない…どこかにヒントがあるはずだ。');
    await sleep(200);
    showChoices([{ text: '↩️ 3階廊下に戻る', action: room_stairsUp }]);
  }
}

async function action_unlockDirector() {
  await typeText('', '4…0…3…');
  await sleep(500);
  seUnlock();
  await typeText('', 'カチッ。ロックが解除された。');
  state.flags.directorUnlocked = true;
  await sleep(200);
  await room_directorRoom();
}

async function action_storage() {
  if (state.flags.storageOpened) {
    await typeText('', '倉庫にはもう何もない。');
    await sleep(200);
    showChoices([{ text: '↩️ 戻る', action: room_stairsUp }]);
    return;
  }
  if (hasItem('storageKey')) {
    await typeText('', '倉庫の鍵を使って扉を開けた。');
    seDoor();
    removeItem('storageKey');
    await sleep(300);
    await typeText('', '中には非常用のバールが立てかけてあった。\nこれがあれば、固い扉もこじ開けられるかもしれない。');
    addItem('crowbar', 'バール', '🔧');
    state.flags.storageOpened = true;
    await sleep(200);
    await typeText('', 'さらに、回復薬が2つ見つかった！');
    player.potions += 2;
    sePickup();
    updateHud();
  } else {
    await typeText('', '倉庫の扉は鍵がかかっている。鍵が必要だ。');
  }
  await sleep(200);
  showChoices([{ text: '↩️ 戻る', action: room_stairsUp }]);
}

// --- Room 5: 院長室 ---
async function room_directorRoom() {
  await fadeTransition(() => {
    setRoom('院長室', 'linear-gradient(180deg, #0d0d0a 0%, #1a0d05 100%)', '📋');
  });
  playBgmSafe();

  if (!state.flags.visitedDirector) {
    await typeText('', '広い部屋だ。大きな机と、革張りの椅子。\n壁には数々の賞状と…何かの実験記録のようなものが貼られている。');
    await sleep(400);
    await typeText('', '机の上に、1枚のカルテが置かれている。');
    await sleep(200);
    await typeText('院長のカルテ', '「被験者No.7 ― 投薬実験後、著しい攻撃性の増加を確認。\n拘束帯では抑えきれず、地下隔離室へ移送。\nなお、被験者は元看護師の██████である。」');
    await sleep(400);
    await typeText('', '………これは、何の実験をしていたんだ？');
    state.flags.visitedDirector = true;
  } else {
    await typeText('', '院長室。ここだけは不気味なほど静かだ。');
  }
  await sleep(200);
  showChoices([
    { text: '🔍 机の引き出しを調べる', action: action_directorDesk },
    { text: '📄 壁の実験記録を読む', action: action_readRecords },
    { text: '↩️ 3階廊下に戻る', action: () => { playBgmExplore(); room_stairsUp(); } },
  ]);
}

async function action_directorDesk() {
  if (!state.flags.searchedDirectorDesk) {
    await typeText('', '引き出しの中に、重厚な鍵が入っていた。\nタグには「正面玄関」と刻まれている。');
    addItem('exitKey', '正面玄関の鍵', '🔑');
    state.flags.searchedDirectorDesk = true;
    await sleep(300);
    await typeText('', 'これで…出口の鍵は手に入った。\nあとはこの建物から脱出するだけだ。');
  } else {
    await typeText('', '引き出しにはもう何もない。');
  }
  await sleep(200);
  showChoices([
    { text: '📋 院長室を調べる', action: room_directorRoom },
    { text: '↩️ 3階廊下に戻る', action: () => { playBgmExplore(); room_stairsUp(); } },
  ]);
}

async function action_readRecords() {
  await typeText('院長の実験記録', '「Phase 3: 被験者の身体能力が常人の域を超えた。\n暗所での視力が著しく向上。光に対して激しい拒否反応。\n人語を話さなくなり、代わりに…」');
  await sleep(400);
  await typeText('', '記録はそこで途切れている。\n紙の端は、何かに引き裂かれたように破れていた。');
  await sleep(200);
  showChoices([{ text: '📋 院長室を調べる', action: room_directorRoom }]);
}

// --- Room 6: 1階ロビー ---
async function room_corridorToLobby() {
  if (hasItem('crowbar') || state.flags.lobbyAccessible) {
    if (!state.flags.lobbyAccessible) {
      await typeText('', 'バールで防火扉をこじ開けた！');
      seDoor();
      screenShake();
      state.flags.lobbyAccessible = true;
      await sleep(400);
    }
    await room_lobby();
  } else {
    await typeText('', '1階への階段を下りると、防火扉が道を塞いでいる。\n素手では開けられそうにない。何か道具が必要だ。');
    await sleep(200);
    showChoices([{ text: '↩️ 2階廊下に戻る', action: room_corridor }]);
  }
}

async function room_lobby() {
  await fadeTransition(() => {
    setRoom('1階 ロビー', 'linear-gradient(180deg, #0a0a0a 0%, #0d0d05 100%)', '🚪');
  });

  await typeText('', '1階のロビーに辿り着いた。\n正面に大きなガラスの扉がある。外の光がかすかに見える…！');
  await sleep(400);

  if (hasItem('exitKey')) {
    showChoices([{ text: '🔑 正面玄関の鍵を使う', action: action_escape }]);
  } else {
    await typeText('', '玄関の扉は厳重に施錠されている。鍵がなければ開かない。');
    await sleep(200);
    showChoices([{ text: '↩️ 2階に戻る', action: room_corridor }]);
  }
}

async function action_escape() {
  await typeText('', '震える手で鍵を差し込む。');
  await sleep(500);
  seUnlock();
  await typeText('', 'カチャ…ッ！扉が開いた！');
  await sleep(400);

  screenShake();
  await typeText('', '………背後から、激しい足音が近づいてくる！');
  await sleep(300);
  await jumpscare('😱', 500);
  await sleep(200);

  await typeText('???', '逃ガサナイ…');
  await sleep(500);

  // FINAL BOSS
  await typeText('', '被験者No.7が行く手を阻む！ 戦わなければ脱出できない！');
  await sleep(300);

  const result = await startBattle('specimen', false);
  if (result === 'lose') {
    await gameOver();
    return;
  }

  // Victory!
  stopBgm();
  await typeText('', '被験者No.7は崩れ落ち…霧のように消えていった。');
  await sleep(500);
  await typeText('', '夢中で外へ飛び出した——');
  await sleep(600);

  await fadeTransition(() => {});
  await sleep(400);

  // Victory fanfare
  seVictory();
  setTimeout(() => seVictory(), 800);

  showEnding(
    'ESCAPE - 脱出成功',
    '朝焼けの光が、あなたの体を包んだ。\n背後の廃病院からは、もう何の物音も聞こえない。\n\nレベル' + player.level + 'まで成長し、数々の恐怖を乗り越え、\nあなたは廃病院からの脱出を果たした。\n\nおめでとうございます。',
    '#44aa00'
  );
}

// --- Room 7: 地下 (Boss Route / Bad End) ---
async function room_basement() {
  await fadeTransition(() => {
    setRoom('地下 隔離室', 'linear-gradient(180deg, #050505 0%, #0a0000 100%)', '⛓️');
  });

  await typeText('', '階段を下りていく。空気が変わった。\n湿気と、何か…腐敗したような臭い。');
  await sleep(500);

  await typeText('', '地下には長い廊下が続いていた。\n壁には何本もの引っかき傷が刻まれている。');
  await sleep(400);

  // Battle in basement
  await typeText('', '…暗闇の中から、何かが近づいてくる！');
  screenShake();
  await sleep(300);

  const result1 = await startBattle('patient', true);
  if (result1 === 'lose') { await gameOver(); return; }
  if (result1 === 'flee') { await room_corridor(); return; }

  await typeText('', '廊下の奥に、鉄の扉がある。少しだけ開いている。');
  await sleep(200);

  showChoices([
    { text: '👁️ 扉の中を覗く', action: action_peekBasement },
    { text: '↩️ 引き返す', action: action_basementReturn },
  ]);
}

async function action_peekBasement() {
  await typeText('', '隙間から中を覗き込む…');
  await sleep(400);
  await typeText('', '暗い。何も見えない。');
  await sleep(300);
  await typeText('', '……目が暗闇に慣れてきた。\n部屋の中には、壊れた拘束具と…');
  await sleep(500);
  screenShake();
  await typeText('', '———部屋は、空だった。');
  await sleep(300);
  await typeText('', 'いや、おかしい。拘束具は壊れている。\nつまり、ここにいた「何か」は——');
  await sleep(500);
  await jumpscare('😱', 800);
  screenShake();
  await sleep(200);

  await typeText('???', 'ミ ツ ケ タ');
  await sleep(400);

  // Unwinnable boss
  await typeText('', '被験者No.7が立ち塞がる！ この狭い空間では逃げられない！');
  const result = await startBattle('specimen', false);
  if (result === 'lose') {
    stopBgm();
    await fadeTransition(() => {});
    showEnding(
      'DEAD END',
      'メモの警告を無視して地下へ向かったあなたは、\n密室で被験者No.7と対峙し…二度と地上に戻ることはなかった。\n\n後日、この廃病院に別の探索者が訪れた時、\n地下の壁には新しい引っかき傷が一本、増えていたという——',
      '#8b0000'
    );
    return;
  }
  // If somehow win (high level)
  stopBgm();
  await typeText('', '信じられない…地下の化け物を倒した！');
  await sleep(300);
  await typeText('', '被験者No.7の残骸の中から、光る何かが見える…');
  addItem('amulet', '呪われたお守り', '🔮');
  state.flags.defeatedBasementBoss = true;
  await sleep(300);
  await typeText('', '急いでここから離れよう。');
  await sleep(200);
  playBgmExplore();
  room_corridor();
}

async function action_basementReturn() {
  await typeText('', 'ここにいてはいけない。本能がそう告げている。');
  await sleep(300);
  await typeText('', '振り返った瞬間——');
  await sleep(200);
  await jumpscare('👁️', 400);
  await typeText('', '暗闇の奥で、何かが動いた気がした。\n急いで階段を駆け上がる！');
  screenShake();
  await sleep(200);
  room_corridor();
}

// ============================================================
// GAME START
// ============================================================
$('start-btn').addEventListener('click', () => {
  initAudio();
  $('title-screen').classList.add('hidden');
  $('game').classList.add('active');
  updateHud();
  setTimeout(() => room_operatingRoom(), 800);
});
</script>
