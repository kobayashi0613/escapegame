<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廃病院からの脱出</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Creepster&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #c8c8c8;
    font-family: 'Noto Sans JP', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* --- Flicker & Noise Overlay --- */
  #noise-overlay {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.15) 0px,
      rgba(0,0,0,.15) 1px,
      transparent 1px,
      transparent 2px
    );
    pointer-events: none;
    z-index: 9999;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker {
    0%   { opacity: 0.97; }
    50%  { opacity: 1; }
    100% { opacity: 0.98; }
  }

  /* --- Vignette --- */
  #vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 9998;
  }

  /* --- Title Screen --- */
  #title-screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000;
    z-index: 1000;
    transition: opacity 1.5s;
  }
  #title-screen.hidden { opacity: 0; pointer-events: none; }
  #title-screen h1 {
    font-family: 'Creepster', cursive;
    font-size: 4rem;
    color: #8b0000;
    text-shadow: 0 0 20px #8b0000, 0 0 60px #5a0000;
    letter-spacing: 0.1em;
    animation: titlePulse 3s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 20px #8b0000, 0 0 60px #5a0000; }
    50%      { text-shadow: 0 0 40px #ff0000, 0 0 80px #8b0000; }
  }
  #title-screen p {
    margin-top: 1rem;
    font-size: 1.1rem;
    color: #666;
  }
  #start-btn {
    margin-top: 2.5rem;
    padding: 0.9rem 3rem;
    background: transparent;
    border: 2px solid #8b0000;
    color: #c8c8c8;
    font-size: 1.2rem;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.15em;
  }
  #start-btn:hover {
    background: #8b0000;
    color: #fff;
    box-shadow: 0 0 30px rgba(139,0,0,0.6);
  }

  /* --- Game Container --- */
  #game {
    display: none;
    width: 100vw; height: 100vh;
    position: relative;
  }
  #game.active { display: block; }

  /* --- Scene --- */
  #scene {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
    transition: background 1s;
  }
  #scene-illustration {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12rem;
    opacity: 0.12;
    pointer-events: none;
    user-select: none;
    transition: opacity 1s;
  }

  /* --- Text Box --- */
  #text-box {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.7));
    padding: 1.5rem 2rem 1.2rem;
    min-height: 180px;
    border-top: 1px solid rgba(139,0,0,0.4);
  }
  #speaker {
    font-weight: 700;
    color: #8b0000;
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
    letter-spacing: 0.08em;
  }
  #message {
    font-size: 1rem;
    line-height: 1.8;
    min-height: 3.6rem;
    white-space: pre-wrap;
  }
  #message .cursor {
    display: inline-block;
    width: 2px; height: 1.1em;
    background: #8b0000;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.7s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* --- Choices --- */
  #choices {
    position: absolute;
    bottom: 200px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column;
    gap: 0.6rem;
    width: min(90%, 600px);
    z-index: 50;
  }
  .choice-btn {
    padding: 0.75rem 1.5rem;
    background: rgba(20,0,0,0.85);
    border: 1px solid rgba(139,0,0,0.5);
    color: #c8c8c8;
    font-size: 1rem;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.25s;
    text-align: left;
  }
  .choice-btn:hover {
    background: rgba(139,0,0,0.35);
    border-color: #8b0000;
    padding-left: 2rem;
  }

  /* --- Inventory --- */
  #inventory-bar {
    position: absolute;
    top: 1rem; right: 1rem;
    display: flex; gap: 0.5rem;
    z-index: 50;
  }
  .inv-item {
    width: 48px; height: 48px;
    background: rgba(20,0,0,0.8);
    border: 1px solid rgba(139,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    border-radius: 4px;
    position: relative;
    cursor: default;
  }
  .inv-item .tooltip {
    display: none;
    position: absolute;
    bottom: -2rem;
    background: rgba(0,0,0,0.9);
    color: #aaa;
    padding: 2px 8px;
    font-size: 0.75rem;
    white-space: nowrap;
    border-radius: 3px;
  }
  .inv-item:hover .tooltip { display: block; }

  /* --- Room Name --- */
  #room-name {
    position: absolute;
    top: 1rem; left: 1.5rem;
    font-size: 0.85rem;
    color: #8b0000;
    letter-spacing: 0.15em;
    z-index: 50;
    text-shadow: 0 0 10px rgba(139,0,0,0.5);
  }

  /* --- Jump-scare overlay --- */
  #jumpscare {
    position: fixed; inset: 0;
    background: #000;
    display: none;
    align-items: center; justify-content: center;
    z-index: 10000;
    flex-direction: column;
  }
  #jumpscare.active { display: flex; }
  #jumpscare .scare-text {
    font-size: 8rem;
    animation: scareShake 0.1s infinite;
  }
  @keyframes scareShake {
    0%  { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-5px, 5px) rotate(-2deg); }
    50% { transform: translate(5px, -5px) rotate(2deg); }
    75% { transform: translate(-3px, -3px) rotate(-1deg); }
    100%{ transform: translate(3px, 3px) rotate(1deg); }
  }

  /* --- Ending Screen --- */
  #ending-screen {
    position: fixed; inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10000;
  }
  #ending-screen.active { display: flex; }
  #ending-screen h2 {
    font-family: 'Creepster', cursive;
    font-size: 3rem;
    margin-bottom: 1rem;
  }
  #ending-screen p {
    font-size: 1.1rem;
    max-width: 520px;
    text-align: center;
    line-height: 1.8;
    color: #999;
  }
  #ending-screen button {
    margin-top: 2rem;
    padding: 0.8rem 2.5rem;
    background: transparent;
    border: 2px solid #8b0000;
    color: #c8c8c8;
    font-size: 1rem;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.3s;
  }
  #ending-screen button:hover {
    background: #8b0000;
    color: #fff;
  }

  /* --- Screen-shake --- */
  .screen-shake {
    animation: screenShake 0.4s;
  }
  @keyframes screenShake {
    0%   { transform: translate(0,0); }
    20%  { transform: translate(-8px,4px); }
    40%  { transform: translate(6px,-6px); }
    60%  { transform: translate(-4px,8px); }
    80%  { transform: translate(8px,-2px); }
    100% { transform: translate(0,0); }
  }

  /* --- Fade transition --- */
  #fade {
    position: fixed; inset: 0;
    background: #000;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s;
  }
  #fade.active { opacity: 1; pointer-events: all; }

  /* --- Blood drip decoration --- */
  .blood-drip {
    position: absolute;
    top: 0;
    width: 4px;
    background: linear-gradient(to bottom, #8b0000, transparent);
    border-radius: 0 0 2px 2px;
    opacity: 0.4;
    animation: drip 4s ease-in infinite;
  }
  @keyframes drip {
    0%   { height: 0; opacity: 0.5; }
    80%  { height: 120px; opacity: 0.3; }
    100% { height: 120px; opacity: 0; }
  }
</style>
</head>
<body>

<div id="noise-overlay"></div>
<div id="vignette"></div>
<div id="fade"></div>

<!-- Title Screen -->
<div id="title-screen">
  <h1>廃病院からの脱出</h1>
  <p>― あなたは目を覚ました。ここは…どこだ？ ―</p>
  <button id="start-btn">ENTER</button>
</div>

<!-- Game -->
<div id="game">
  <div id="scene">
    <div id="scene-illustration"></div>
    <!-- Blood drips -->
    <div class="blood-drip" style="left:10%; animation-delay:0s;"></div>
    <div class="blood-drip" style="left:30%; animation-delay:1.2s;"></div>
    <div class="blood-drip" style="left:55%; animation-delay:2.5s;"></div>
    <div class="blood-drip" style="left:80%; animation-delay:0.8s;"></div>
    <div class="blood-drip" style="left:92%; animation-delay:3.1s;"></div>
  </div>
  <div id="room-name"></div>
  <div id="inventory-bar"></div>
  <div id="choices"></div>
  <div id="text-box">
    <div id="speaker"></div>
    <div id="message"></div>
  </div>
</div>

<!-- Jumpscare -->
<div id="jumpscare">
  <div class="scare-text"></div>
</div>

<!-- Ending -->
<div id="ending-screen">
  <h2 id="ending-title"></h2>
  <p id="ending-text"></p>
  <button onclick="location.reload()">もう一度プレイする</button>
</div>

<script>
// =====================================================
// Horror Escape Game Engine
// =====================================================

const $ = id => document.getElementById(id);

// --- State ---
const state = {
  inventory: [],
  flags: {},
  currentRoom: null,
  typing: false,
  typingResolve: null,
};

// --- Audio (Web Audio API for atmosphere) ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTone(freq, duration, type = 'sine', vol = 0.08) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playHorrorAmbience() {
  if (!audioCtx) return;
  // Low drone
  playTone(55, 4, 'sawtooth', 0.03);
  playTone(58, 4, 'sine', 0.02);
  setTimeout(() => playTone(110, 2, 'triangle', 0.015), 2000);
}

function playScareSound() {
  if (!audioCtx) return;
  playTone(180, 0.5, 'sawtooth', 0.15);
  playTone(220, 0.3, 'square', 0.12);
  setTimeout(() => playTone(80, 0.4, 'sawtooth', 0.1), 100);
}

function playDoorSound() {
  if (!audioCtx) return;
  playTone(80, 0.6, 'triangle', 0.06);
  setTimeout(() => playTone(60, 0.8, 'sine', 0.04), 200);
}

function playPickupSound() {
  if (!audioCtx) return;
  playTone(440, 0.15, 'sine', 0.06);
  setTimeout(() => playTone(550, 0.15, 'sine', 0.05), 100);
}

function playUnlockSound() {
  if (!audioCtx) return;
  playTone(330, 0.2, 'triangle', 0.06);
  setTimeout(() => playTone(440, 0.2, 'triangle', 0.06), 150);
  setTimeout(() => playTone(550, 0.2, 'triangle', 0.06), 300);
}

// Start ambient loop
let ambienceInterval;
function startAmbience() {
  playHorrorAmbience();
  ambienceInterval = setInterval(playHorrorAmbience, 5000);
}

// --- Typewriter ---
function typeText(speaker, text) {
  return new Promise(resolve => {
    $('speaker').textContent = speaker;
    $('message').innerHTML = '';
    state.typing = true;
    state.typingResolve = resolve;

    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    function tick() {
      if (!state.typing) {
        // Skip to end
        $('message').textContent = text;
        resolve();
        return;
      }
      if (i < text.length) {
        $('message').textContent = text.substring(0, i + 1);
        $('message').appendChild(cursor);
        i++;
        // Random timing for creepy effect
        const delay = text[i - 1] === '。' || text[i - 1] === '…' ? 120 : 30 + Math.random() * 30;
        setTimeout(tick, delay);
      } else {
        state.typing = false;
        $('message').appendChild(cursor);
        resolve();
      }
    }
    tick();
  });
}

// Click to skip typing
document.addEventListener('click', () => {
  if (state.typing) {
    state.typing = false;
  }
});

// --- UI Helpers ---
function showChoices(choices) {
  const el = $('choices');
  el.innerHTML = '';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.addEventListener('click', () => {
      el.innerHTML = '';
      c.action();
    });
    el.appendChild(btn);
  });
}

function clearChoices() {
  $('choices').innerHTML = '';
}

function updateInventory() {
  const bar = $('inventory-bar');
  bar.innerHTML = '';
  state.inventory.forEach(item => {
    const div = document.createElement('div');
    div.className = 'inv-item';
    div.innerHTML = `${item.icon}<span class="tooltip">${item.name}</span>`;
    bar.appendChild(div);
  });
}

function addItem(id, name, icon) {
  if (!state.inventory.find(i => i.id === id)) {
    state.inventory.push({ id, name, icon });
    playPickupSound();
    updateInventory();
  }
}

function hasItem(id) {
  return state.inventory.some(i => i.id === id);
}

function removeItem(id) {
  state.inventory = state.inventory.filter(i => i.id !== id);
  updateInventory();
}

function setRoom(name, bg, emoji) {
  $('room-name').textContent = name;
  $('scene').style.background = bg;
  $('scene-illustration').textContent = emoji;
  state.currentRoom = name;
}

async function fadeTransition(fn) {
  $('fade').classList.add('active');
  await sleep(800);
  if (fn) await fn();
  await sleep(300);
  $('fade').classList.remove('active');
}

function screenShake() {
  $('scene').classList.add('screen-shake');
  setTimeout(() => $('scene').classList.remove('screen-shake'), 400);
}

async function jumpscare(emoji, duration = 800) {
  playScareSound();
  const el = $('jumpscare');
  el.querySelector('.scare-text').textContent = emoji;
  el.classList.add('active');
  screenShake();
  await sleep(duration);
  el.classList.remove('active');
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function showEnding(title, text, color = '#8b0000') {
  const el = $('ending-screen');
  $('ending-title').textContent = title;
  $('ending-title').style.color = color;
  $('ending-text').textContent = text;
  el.classList.add('active');
}

// =====================================================
// GAME CONTENT - Rooms & Story
// =====================================================

// --- Room 1: 手術室 ---
async function room_operatingRoom() {
  await fadeTransition(() => {
    setRoom('手術室', 'linear-gradient(180deg, #0d0d0d 0%, #1a0505 100%)', '🏥');
  });

  await typeText('', 'ぼんやりとした意識の中、冷たい金属の感触で目が覚めた。');
  await sleep(500);
  await typeText('', '蛍光灯が不規則に明滅している…ここは…手術室？\n古びた手術台の上に横たわっていたようだ。');
  await sleep(500);
  await typeText('', '辺りには錆びた医療器具が散乱している。\n空気は重く、かすかに血の匂いがする。');

  await sleep(300);
  showRoomChoices_operatingRoom();
}

function showRoomChoices_operatingRoom() {
  const choices = [
    { text: '手術台の周りを調べる', action: action_searchTable },
    { text: '棚を調べる', action: action_searchShelf },
    { text: '扉に向かう', action: action_tryDoor1 },
  ];
  if (state.flags.foundNote1) {
    choices.push({ text: '廊下へ出る', action: room_corridor });
  }
  showChoices(choices);
}

async function action_searchTable() {
  if (!state.flags.searchedTable) {
    await typeText('', '手術台の下に、何かが落ちている…');
    await sleep(400);
    screenShake();
    await typeText('', '古い懐中電灯だ。電池はまだ残っているようだ。');
    addItem('flashlight', '懐中電灯', '🔦');
    state.flags.searchedTable = true;
  } else {
    await typeText('', '手術台の周りには、もう目ぼしいものはない。');
  }
  await sleep(300);
  showRoomChoices_operatingRoom();
}

async function action_searchShelf() {
  if (!state.flags.searchedShelf) {
    await typeText('', '埃をかぶった棚を漁る。割れた薬瓶、変色した包帯…');
    await sleep(500);
    await typeText('', '棚の奥に、折りたたまれたメモが挟まっていた。');
    await sleep(300);
    await typeText('???のメモ', '「3階の院長室に鍵がある。地下には絶対に行くな。\nあいつが来る前に逃げろ。」');
    state.flags.foundNote1 = true;
    state.flags.searchedShelf = true;
    addItem('memo1', '誰かのメモ', '📝');
    await sleep(400);
    await typeText('', '…扉の鍵が、内側から外れているのに気付いた。');
    playDoorSound();
  } else {
    await typeText('', '棚にはもう何もない。埃が舞うだけだ。');
  }
  await sleep(300);
  showRoomChoices_operatingRoom();
}

async function action_tryDoor1() {
  if (!state.flags.foundNote1) {
    await typeText('', '扉は…固い。内側から何かで固定されているようだ。\nもう少しこの部屋を調べた方がいい。');
  } else {
    await typeText('', '扉は開く。暗い廊下が続いている…');
    await sleep(300);
    showChoices([
      { text: '廊下へ出る', action: room_corridor },
      { text: 'もう少し部屋を調べる', action: () => showRoomChoices_operatingRoom() },
    ]);
    return;
  }
  await sleep(300);
  showRoomChoices_operatingRoom();
}

// --- Room 2: 廊下 ---
async function room_corridor() {
  await fadeTransition(() => {
    setRoom('2階 廊下', 'linear-gradient(180deg, #0a0a0a 0%, #0d0808 100%)', '🚪');
  });

  if (!state.flags.visitedCorridor) {
    await typeText('', '廊下に出た。非常灯の赤い光が、壁を不気味に照らしている。');
    await sleep(400);
    playHorrorAmbience();
    await typeText('', '右手には階段の案内表示が見える。\n左手には「ナースステーション」と書かれたプレートが。');
    await sleep(300);
    await typeText('', '…どこかから、何かを引きずるような音が聞こえる。');
    screenShake();
    state.flags.visitedCorridor = true;
  } else {
    await typeText('', '薄暗い廊下。非常灯だけが頼りだ。');
  }

  await sleep(300);

  const choices = [
    { text: 'ナースステーションへ', action: room_nurseStation },
    { text: '階段で3階へ上がる', action: room_stairsUp },
  ];
  if (!state.flags.warnedBasement) {
    choices.push({ text: '階段で地下へ下りる', action: action_goBasement });
  } else {
    choices.push({ text: '階段で地下へ下りる（メモには行くなと…）', action: action_goBasementConfirm });
  }
  choices.push({ text: '手術室に戻る', action: room_operatingRoom });
  showChoices(choices);
}

async function action_goBasement() {
  await typeText('', '地下へ向かおうとした瞬間、メモの言葉が頭をよぎる。\n「地下には絶対に行くな」');
  state.flags.warnedBasement = true;
  await sleep(300);
  room_corridor();
}

async function action_goBasementConfirm() {
  showChoices([
    { text: 'それでも地下へ下りる', action: room_basement },
    { text: 'やめておく', action: room_corridor },
  ]);
}

// --- Room 3: ナースステーション ---
async function room_nurseStation() {
  await fadeTransition(() => {
    setRoom('ナースステーション', 'linear-gradient(180deg, #0d0a0a 0%, #1a0d0d 100%)', '💊');
  });

  if (!state.flags.visitedNurse) {
    await typeText('', 'カウンターの向こうには、散乱したカルテと壊れたパソコン。');
    await sleep(400);
    await typeText('', '壁にかけられたホワイトボードには、判読できない文字で\n何かが殴り書きされている…');
    await sleep(300);

    if (hasItem('flashlight')) {
      await typeText('', '懐中電灯で照らすと、文字が読めた。');
      await sleep(300);
      await typeText('ホワイトボード', '「暗証番号: 院長の部屋番号を逆から\n部屋番号は 304」');
      state.flags.knowPasscode = true;
      await typeText('', '…つまり暗証番号は「403」か。');
    } else {
      await typeText('', '暗くて文字が読めない。明かりがあれば…');
    }
    state.flags.visitedNurse = true;
  } else {
    await typeText('', 'ナースステーション。カルテが散らばっている。');
    if (!state.flags.knowPasscode && hasItem('flashlight')) {
      await typeText('', '懐中電灯で照らすと、ホワイトボードの文字が読めた。');
      await typeText('ホワイトボード', '「暗証番号: 院長の部屋番号を逆から\n部屋番号は 304」');
      state.flags.knowPasscode = true;
      await typeText('', '…暗証番号は「403」だ。');
    }
  }

  await sleep(300);

  const choices = [
    { text: 'カウンターの引き出しを調べる', action: action_nurseDrawer },
    { text: '廊下に戻る', action: room_corridor },
  ];
  showChoices(choices);
}

async function action_nurseDrawer() {
  if (!state.flags.searchedNurseDrawer) {
    await typeText('', '引き出しを開けると…古い鍵が1つ。ラベルには「倉庫」と書かれている。');
    addItem('storageKey', '倉庫の鍵', '🗝️');
    state.flags.searchedNurseDrawer = true;
  } else {
    await typeText('', '引き出しにはもう何もない。');
  }
  await sleep(300);
  showChoices([
    { text: '廊下に戻る', action: room_corridor },
  ]);
}

// --- Room 4: 3階 ---
async function room_stairsUp() {
  await fadeTransition(() => {
    setRoom('3階 廊下', 'linear-gradient(180deg, #0a0a0d 0%, #0d0505 100%)', '🔒');
  });

  if (!state.flags.visited3F) {
    await typeText('', '3階に上がった。ここは一段と暗い。');
    await sleep(400);
    await typeText('', '廊下の突き当たりに「院長室 304」と書かれた扉がある。\nその手前に、鍵のかかった倉庫がある。');
    state.flags.visited3F = true;

    // Random scare event
    await sleep(800);
    await typeText('', '……ッ！');
    await jumpscare('👁️', 600);
    await typeText('', '廊下の奥の暗闇から、何かがこちらを見ていた気がした…\nいや、気のせいだ。気のせいだと思いたい。');
  } else {
    await typeText('', '3階の廊下。院長室と倉庫がある。');
  }

  await sleep(300);

  const choices = [
    { text: '院長室の扉を調べる', action: action_directorDoor },
    { text: '倉庫を調べる', action: action_storage },
    { text: '2階に戻る', action: room_corridor },
  ];
  showChoices(choices);
}

async function action_directorDoor() {
  if (state.flags.directorUnlocked) {
    await room_directorRoom();
    return;
  }

  await typeText('', '院長室の扉にはテンキー式のロックがかかっている。');

  if (state.flags.knowPasscode) {
    showChoices([
      { text: '暗証番号「403」を入力する', action: action_unlockDirector },
      { text: '戻る', action: room_stairsUp },
    ]);
  } else {
    await typeText('', '暗証番号が分からない…どこかにヒントがあるはずだ。');
    await sleep(300);
    showChoices([
      { text: '3階廊下に戻る', action: room_stairsUp },
    ]);
  }
}

async function action_unlockDirector() {
  await typeText('', '4…0…3…');
  await sleep(600);
  playUnlockSound();
  await typeText('', 'カチッ。ロックが解除された。');
  state.flags.directorUnlocked = true;
  await sleep(300);
  await room_directorRoom();
}

async function action_storage() {
  if (state.flags.storageOpened) {
    await typeText('', '倉庫の中にはもう何もない。');
    await sleep(300);
    showChoices([{ text: '戻る', action: room_stairsUp }]);
    return;
  }

  if (hasItem('storageKey')) {
    await typeText('', '倉庫の鍵を使って扉を開けた。');
    playDoorSound();
    removeItem('storageKey');
    await sleep(400);
    await typeText('', '中には非常用のバールが立てかけてあった。\nこれがあれば、固い扉もこじ開けられるかもしれない。');
    addItem('crowbar', 'バール', '🔧');
    state.flags.storageOpened = true;
  } else {
    await typeText('', '倉庫の扉は鍵がかかっている。鍵が必要だ。');
  }
  await sleep(300);
  showChoices([{ text: '戻る', action: room_stairsUp }]);
}

// --- Room 5: 院長室 ---
async function room_directorRoom() {
  await fadeTransition(() => {
    setRoom('院長室', 'linear-gradient(180deg, #0d0d0a 0%, #1a0d05 100%)', '📋');
  });

  if (!state.flags.visitedDirector) {
    await typeText('', '広い部屋だ。大きな机と、革張りの椅子。\n壁には数々の賞状と…何かの実験記録のようなものが貼られている。');
    await sleep(500);
    await typeText('', '机の上に、1枚のカルテが置かれている。');
    await sleep(300);
    await typeText('院長のカルテ', '「被験者No.7 ― 投薬実験後、著しい攻撃性の増加を確認。\n拘束帯では抑えきれず、地下隔離室へ移送。\nなお、被験者は元看護師の██████である。」');
    await sleep(500);
    await typeText('', '………これは、何の実験をしていたんだ？');
    state.flags.visitedDirector = true;
  } else {
    await typeText('', '院長室。不気味な実験記録が壁に貼られている。');
  }

  await sleep(300);

  const choices = [
    { text: '机の引き出しを調べる', action: action_directorDesk },
    { text: '壁の実験記録を詳しく読む', action: action_readRecords },
    { text: '3階廊下に戻る', action: room_stairsUp },
  ];
  showChoices(choices);
}

async function action_directorDesk() {
  if (!state.flags.searchedDirectorDesk) {
    await typeText('', '引き出しの中に、重厚な鍵が入っていた。\nタグには「正面玄関」と刻まれている。');
    addItem('exitKey', '正面玄関の鍵', '🔑');
    state.flags.searchedDirectorDesk = true;
    await sleep(400);
    await typeText('', 'これで…出口の鍵は手に入った。\nあとはこの建物から脱出するだけだ。');
  } else {
    await typeText('', '引き出しにはもう何もない。');
  }
  await sleep(300);
  showChoices([
    { text: '院長室を調べる', action: room_directorRoom },
    { text: '3階廊下に戻る', action: room_stairsUp },
  ]);
}

async function action_readRecords() {
  await typeText('院長の実験記録', '「Phase 3: 被験者の身体能力が常人の域を超えた。\n暗所での視力が著しく向上。光に対して激しい拒否反応。\n人語を話さなくなり、代わりに…」');
  await sleep(500);
  await typeText('', '記録はそこで途切れている。\n紙の端は、何かに引き裂かれたように破れていた。');
  await sleep(300);
  showChoices([
    { text: '院長室を調べる', action: room_directorRoom },
  ]);
}

// --- Room 6: 1階ロビー (Exit) ---
async function room_lobby() {
  await fadeTransition(() => {
    setRoom('1階 ロビー', 'linear-gradient(180deg, #0a0a0a 0%, #0d0d05 100%)', '🚪');
  });

  await typeText('', '1階のロビーに辿り着いた。\n正面に大きなガラスの扉がある。外の光がかすかに見える…！');
  await sleep(500);

  if (hasItem('exitKey')) {
    showChoices([
      { text: '正面玄関の鍵を使う', action: action_escape },
    ]);
  } else {
    await typeText('', '玄関の扉は厳重に施錠されている。鍵がなければ開かない。');
    await sleep(300);
    showChoices([
      { text: '2階に戻る', action: room_corridor },
    ]);
  }
}

async function action_escape() {
  await typeText('', '震える手で鍵を差し込む。');
  await sleep(600);
  playUnlockSound();
  await typeText('', 'カチャ…ッ！扉が開いた！');
  await sleep(500);

  // Final scare
  screenShake();
  await typeText('', '………背後から、激しい足音が近づいてくる！');
  await sleep(300);
  await jumpscare('👤', 500);
  playScareSound();
  await sleep(200);

  await typeText('', '振り返らず、夢中で外へ飛び出した——');
  await sleep(800);

  await fadeTransition(() => {});
  await sleep(500);
  showEnding(
    'ESCAPE - 脱出成功',
    '朝焼けの光が、あなたの体を包んだ。\n背後の廃病院からは、もう何の物音も聞こえない。\n\nあの病院で何があったのか、あなたには分からない。\nただ一つ確かなのは——もう二度と戻りたくない、ということだけだ。\n\nおめでとうございます。あなたは廃病院から脱出しました。',
    '#4a8b00'
  );
}

// --- Room 7: 地下 (Bad Ending) ---
async function room_basement() {
  await fadeTransition(() => {
    setRoom('地下 隔離室', 'linear-gradient(180deg, #050505 0%, #0a0000 100%)', '⛓️');
  });

  await typeText('', '階段を下りていく。空気が変わった。\n湿気と、何か…腐敗したような臭い。');
  await sleep(600);
  playHorrorAmbience();

  await typeText('', '地下には長い廊下が続いていた。\n壁には何本もの引っかき傷が刻まれている。');
  await sleep(500);

  await typeText('', '廊下の奥に、鉄の扉がある。少しだけ開いている。');
  await sleep(300);

  showChoices([
    { text: '扉の中を覗く', action: action_peekBasement },
    { text: '引き返す', action: action_basementReturn },
  ]);
}

async function action_peekBasement() {
  await typeText('', '隙間から中を覗き込む。');
  await sleep(500);
  await typeText('', '暗い。何も見えない。');
  await sleep(400);
  await typeText('', '……目が暗闇に慣れてきた。\n部屋の中には、壊れた拘束具と…');
  await sleep(600);

  screenShake();
  await typeText('', '———部屋は、空だった。');
  await sleep(400);

  await typeText('', 'いや、おかしい。拘束具は壊れている。\nつまり、ここにいた「何か」は——');
  await sleep(600);

  await jumpscare('😱', 1000);
  screenShake();
  playScareSound();
  await sleep(300);

  await typeText('???', 'ミ ツ ケ タ');
  await sleep(800);

  await fadeTransition(() => {});
  await sleep(500);
  showEnding(
    'DEAD END',
    'メモの警告を無視して地下へ向かったあなたは、\n二度と地上に戻ることはなかった。\n\n後日、この廃病院に別の探索者が訪れた時、\n地下の壁には新しい引っかき傷が一本、増えていたという——',
    '#8b0000'
  );
}

async function action_basementReturn() {
  await typeText('', 'ここにいてはいけない。本能がそう告げている。');
  await sleep(400);

  // Scare on returning
  await typeText('', '振り返った瞬間——');
  await sleep(300);
  await jumpscare('👁️', 500);
  await typeText('', '暗闇の奥で、何かが動いた気がした。\n急いで階段を駆け上がる！');
  screenShake();
  await sleep(300);
  room_corridor();
}

// --- Navigation: Going down from corridor ---
async function room_corridorToLobby() {
  if (hasItem('crowbar') || state.flags.lobbyAccessible) {
    state.flags.lobbyAccessible = true;
    await room_lobby();
  } else {
    await typeText('', '1階への階段を下りると、防火扉が道を塞いでいる。\n素手では開けられそうにない。何か道具が必要だ。');
    await sleep(300);
    showChoices([
      { text: '2階廊下に戻る', action: room_corridor },
    ]);
  }
}

// Update corridor to include lobby route
const original_room_corridor = room_corridor;
room_corridor = async function() {
  await fadeTransition(() => {
    setRoom('2階 廊下', 'linear-gradient(180deg, #0a0a0a 0%, #0d0808 100%)', '🚪');
  });

  if (!state.flags.visitedCorridor) {
    await typeText('', '廊下に出た。非常灯の赤い光が、壁を不気味に照らしている。');
    await sleep(400);
    playHorrorAmbience();
    await typeText('', '右手には上下に続く階段。\n左手には「ナースステーション」と書かれたプレートが。');
    await sleep(300);
    await typeText('', '…どこかから、何かを引きずるような音が聞こえる。');
    screenShake();
    state.flags.visitedCorridor = true;
  } else {
    await typeText('', '薄暗い廊下。非常灯だけが頼りだ。');
  }

  await sleep(300);

  const choices = [
    { text: 'ナースステーションへ', action: room_nurseStation },
    { text: '階段で3階へ上がる', action: room_stairsUp },
    { text: '階段で1階へ下りる', action: room_corridorToLobby },
  ];
  if (!state.flags.warnedBasement) {
    choices.push({ text: '階段で地下へ下りる', action: action_goBasement });
  } else {
    choices.push({ text: '階段で地下へ下りる（メモには行くなと…）', action: action_goBasementConfirm });
  }
  choices.push({ text: '手術室に戻る', action: room_operatingRoom });
  showChoices(choices);
};

// =====================================================
// GAME START
// =====================================================

$('start-btn').addEventListener('click', () => {
  initAudio();
  $('title-screen').classList.add('hidden');
  $('game').classList.add('active');
  startAmbience();
  setTimeout(() => {
    room_operatingRoom();
  }, 1000);
});
</script>
</body>
